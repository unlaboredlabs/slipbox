# Builds the program for one platform and smoke-tests it. CI and Release both
# call this, so what CI checks is exactly what Release ships.
name: Build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        description: The asset's platform, such as linux-x64
        type: string
        required: true
      ref:
        description: The commit to build
        type: string
        required: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3
  NAME: slipbox

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # the version counts every commit
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build (web/ too, when it exists)
        run: bun server/build.ts --release --outfile "dist/$NAME-${{ inputs.target }}"
      - name: Smoke test
        run: bun server/smoke.ts "dist/$NAME-${{ inputs.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}-${{ inputs.target }}
          path: dist/${{ env.NAME }}-${{ inputs.target }}
          if-no-files-found: error
          retention-days: 3
